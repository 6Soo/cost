[package]
name = "cost-domain"
description = "판정 타입·우선순위·불변식 (DB·프로세스·네트워크를 모른다)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# 발급 기능은 허용 크레이트만 켠다(tests/issuer_allowlist.rs가 강제).
refund-issuer = []
scope-issuer = []

[lints]
workspace = true

[dependencies]
regex = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"

