<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실제 자료 검토</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic',sans-serif;
 margin:0;background:#f7f8f7;color:#202521;font-size:14px;line-height:1.5}
header{background:#fff;border-bottom:1px solid #e3e7e3;padding:12px 20px;
 position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0 0 4px}
.crumb{font-size:12.5px;color:#657068}
.crumb a{color:#1c7a52}
#status{padding:10px 20px;background:#fff;border-bottom:1px solid #e3e7e3;
 font-size:13.5px}
#status.err{background:#fdf1f0;color:#a4342a;border-color:#f0c9c4}
#status.ok{background:#f1f7f3;color:#166444;border-color:#cfe3d7}
#status.warn{background:#fff8e1;color:#8a5a12;border-color:#f0dcae}
#counts{display:flex;gap:20px;flex-wrap:wrap;padding:10px 20px;font-size:13px;
 background:#fff;border-bottom:1px solid #e3e7e3}
#counts b{font-size:15px}
main{padding:16px 20px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;max-width:100%}
.bar input[type=search]{height:36px;min-width:240px;padding:0 10px;border:1px solid #e3e7e3;
 border-radius:4px;font:inherit}
.bar select{height:36px;max-width:100%;padding:0 10px;border:1px solid #e3e7e3;
 border-radius:4px;background:#fff;color:inherit;font:inherit}
button{height:36px;padding:0 14px;border:1px solid #202521;border-radius:4px;
 background:#fff;font:inherit;font-weight:600;cursor:pointer}
button.primary{background:#1c7a52;border-color:#1c7a52;color:#fff}
button[disabled]{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid #e3e7e3;border-radius:6px;padding:14px;
 margin:10px 0;min-width:0}
.card h2{font-size:15px;margin:0 0 4px}
.ref{font-size:12px;color:#657068;word-break:break-all}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.panel{border:1px solid #e3e7e3;border-radius:6px;padding:10px;min-width:0}
.panel h3{margin:0 0 8px;font-size:14px}
.field{font-size:13px;margin:3px 0}
.field .label{font-weight:600}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border:1px solid #e3e7e3;
 border-radius:3px;color:#657068}
.badge.no{border-color:#f0c9c4;color:#a4342a;background:#fdf1f0}
.badge.yes{border-color:#cfe3d7;color:#166444;background:#f1f7f3}
table.fields{border-collapse:collapse;width:100%;margin-top:8px}
table.fields th,table.fields td{border:1px solid #e3e7e3;padding:4px 6px;
 font-size:12.5px;text-align:left;word-break:break-word}
.cand{border:1px solid #e3e7e3;border-radius:6px;padding:8px;margin:6px 0;min-width:0}
fieldset{border:1px dashed #8b958d;border-radius:6px;padding:10px;margin:10px 0 0;min-width:0}
legend{font-size:13px;font-weight:600;padding:0 4px}
.opt{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;cursor:pointer}
.opt input{width:18px;height:18px;margin:0}
.opt .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
 color:#657068}
.transaction-summary{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0;font-size:15px}
.transaction-summary b{font-size:20px}
.review-evidence{margin-top:10px}
.review-evidence>summary,.guidance-rule>summary{cursor:pointer;color:#1c7a52;padding:6px 0}
.guidance{margin-top:10px;border-top:1px solid #e3e7e3;padding-top:10px}
.guidance label{display:block;font-weight:600;margin:6px 0}
.guidance textarea,.guidance input[type=text],.guidance select{width:100%;max-width:100%;
 min-width:0;padding:8px;border:1px solid #d7ded8;border-radius:4px;font:inherit;color:inherit;background:#fff}
.guidance textarea{resize:vertical;min-height:64px}
.guidance .scope-option{font-weight:400;display:flex;align-items:center;gap:8px}
.guidance-message{overflow-wrap:anywhere;margin:6px 0}
.opt.sel{font-weight:600}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;
 padding:14px 0;font-size:13.5px}
.note{background:#fff8e1;border:1px solid #f0dcae;padding:10px 12px;border-radius:6px;
 font-size:13px;margin:10px 0}
.warntext{color:#a4342a;font-weight:600;font-size:13px}
#applyBox{padding:16px 20px 0;max-width:100%}
#planList{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.field,.ref,.opt,.key{overflow-wrap:anywhere;word-break:break-word}
@media (max-width:820px){.panels{grid-template-columns:1fr}}
@media (max-width:600px){
 header,#status,#counts{padding-left:12px;padding-right:12px}
 main{padding:12px 12px 32px}
 #applyBox{padding:12px 12px 0}
 #counts{gap:8px 14px}
 .bar{align-items:stretch}
 .bar label{flex:0 0 100%}
 .bar input[type=search]{min-width:0;width:100%;flex:1 1 100%}
 .bar select{min-width:0;width:100%;flex:1 1 100%}
 .bar button{flex:1 1 auto;min-width:0;padding-left:10px;padding-right:10px}
 .card{padding:10px}
 .panel{padding:8px}
 table.fields{display:table;width:100%;max-width:100%;table-layout:fixed;overflow:visible}
 table.fields th,table.fields td{min-width:0;width:auto;overflow-wrap:anywhere;word-break:break-word}
 .pager{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
<h1>실제 자료 검토</h1>
<p class="crumb"><a href="/board">장부</a></p>
</header>
<p id="status" role="status" aria-live="polite">불러오는 중입니다.</p>
<div id="counts"></div>
<p id="refresh" role="status" aria-live="polite"></p>
<section id="applyBox">
  <h2>장부 반영</h2>
  <div class="bar">
    <button id="planBtn" type="button">반영 계획 보기</button>
    <button id="applyBtn" type="button" disabled>반영 실행하기</button>
  </div>
  <div id="planCounts"></div>
  <div id="planList"></div>
</section>
<main>
<div class="bar">
<label for="kind">자료 구분</label>
<select id="kind">
<option value="expense">지출</option>
<option value="income">입금</option>
<option value="unknown">구분 확인 필요</option>
<option value="all">전체</option>
</select>
<label for="q">찾기</label>
<input id="q" type="search" placeholder="원본 위치, 내용, 후보 키" autocomplete="off">
<button id="searchBtn" type="button">찾기</button>
<button id="clearBtn" type="button">지우기</button>
<button id="saveBtn" type="button" class="primary" disabled>결정 저장</button>
<button id="exportBtn" type="button" disabled>내보내기</button>
<button id="reloadBtn" type="button">다른 기기 변경 다시 불러오기</button>
</div>
<p id="conflict" class="note" hidden></p>
<div id="rows"></div>
<div class="pager">
<button id="prevBtn" type="button">이전</button>
<span id="pageLabel"></span>
<button id="nextBtn" type="button">다음</button>
</div>
</main>
<script>
(function() {
"use strict";
var PAGE_SIZE = __PAGE_SIZE__, POLL_MS = __POLL_MS__;
var stateUrl = "/api/review/model";
var saveUrl = "/api/review/decisions";
var exportUrl = "/api/review/export";

var rows = [];          // the model rows, untouched
var choices = {};       // ref -> "" | "REJECT" | "APPROVE:key"
var savedChoices = {};  // what the server last confirmed
var savedRevision = -1;
var savedBinding = "";
var page = 0;
var filter = "";
// Card reconciliation starts with expense sources. Other source types remain
// available through the kind selector and never become implicit decisions.
var kindFilter = "expense";
var saving = false;
var stopped = false;
// A full model fetch is in flight. Polling waits for it: the small answer says
// nothing about whether the big one has landed, so a poll that arrives first is
// comparing the server's binding against a page that has not read any source yet.
var loading = false;
var polling = false;

function el(id) { return document.getElementById(id); }
// The collector's outcome, in fixed terms.
//
// A failed collection writes no config, so the page keeps serving the last good
// rows and on its own looks exactly like a source that has not changed. The
// difference has to be stated, and the code is fixed so it says the same thing to
// everyone — something an operator can search for rather than a sentence to
// interpret. These are the collector's own codes, named here rather than typed,
// so the page cannot drift from what the collector actually writes.
var REFRESH_OK_CODE = "REFRESH_CONFIG_REPLACED";
var REFRESH_LABELS = {
  "REVIEW_REFRESH_STATUS_UNKNOWN":
    "마지막 갱신 결과를 아직 모릅니다.",
  "REVIEW_REFRESH_STATUS_INVALID":
    "갱신 결과 기록을 읽지 못했습니다."
};
function refreshLabel(code) {
  if (typeof code !== "string" || code === "") { return ""; }
  if (REFRESH_LABELS[code]) { return REFRESH_LABELS[code]; }
  if (code === REFRESH_OK_CODE) { return "실제 자료는 갱신됐어요."; }
  return "실제 자료를 갱신하지 못했습니다. 코드: " + code;
}
// ---------------------------------------------------------------- ledger apply
//
// Two separate actions, and the second is impossible until the first has been
// answered. The plan is a read of what is stored; the apply is a write. Nothing on
// this page runs an apply by itself: there is no polling call to it, no apply on
// save, and no apply on reload. The owner reads the counts and then presses the
// button that says what it will do.
var applyUrl = "__APPLY_URL__";
var planUrl = "__PLAN_URL__";
var applyPlanState = null;

function renderApplyPlan(plan) {
  applyPlanState = plan;
  var counts = el("planCounts");
  clear(counts);
  // A plan from before a refusal is not a plan the owner may act on.
  el("applyBtn").disabled = true;
  var shown = plan.counts || {};
  // Two units, named where they are shown. The first three count card
  // transactions — what an apply would write — and the last two count rows of the
  // review the owner was looking at. Adding them together would be a number about
  // nothing, so they are on separate lines.
  add(counts, "p", "counts-line",
      "새로 반영할 거래 " + text(shown.applicable_transactions || 0) + "건, "
      + "이미 반영한 거래 " + text(shown.already_applied_transactions || 0) + "건, "
      + "충돌 거래 " + text(shown.conflict_transactions || 0) + "건");
  add(counts, "p", "counts-line",
      "승인한 검토 행 " + text(shown.approved_refs || 0) + "행 중 계속 보류 "
      + text(shown.held_refs || 0) + "행");
  var list = el("planList");
  clear(list);
  var pending = plan.transactions || [];
  if (pending.length) {
    var table = add(list, "table");
    // `addRow` builds the row itself, so it is handed the `thead` — not a row
    // inside it. Passing a `tr` put a `tr` inside a `tr`, and the browser then
    // repairs that in a way that leaves the header a column out of step with the
    // body.
    addRow(add(table, "thead"), ["검토 행", "원본 거래키"], {head: true});
    var body = add(table, "tbody");
    for (var i = 0; i < pending.length; i++) {
      addRow(body, [pending[i].ref, pending[i].source_event_key]);
    }
  }
  var held = plan.held_refs || [];
  for (var h = 0; h < held.length; h++) {
    add(list, "p", "field", held[h].ref + " · " + held[h].code);
  }
  var done = plan.already_applied || [];
  for (var d = 0; d < done.length; d++) {
    add(list, "p", "field",
        "이미 반영 · " + done[d].source_event_key);
  }
  if (plan.conflicts && plan.conflicts.length) {
    add(list, "p", "err",
        "충돌 " + plan.conflicts.length
        + "건은 자동 반영하지 않아요. 같은 거래키의 원천 사실이 바뀌었습니다.");
    for (var c = 0; c < plan.conflicts.length; c++) {
      add(list, "p", "field",
          plan.conflicts[c].source_event_key + " · "
          + plan.conflicts[c].code);
    }
  }
  el("applyBtn").disabled = !(shown.applicable_transactions > 0);
}

function loadPlan() {
  setStatus("반영 계획을 세우는 중입니다...", "");
  return fetch(planUrl, {method: "GET", credentials: "same-origin",
                         cache: "no-store",
                         headers: {"Accept": "application/json"}})
    .then(function(response) {
      if (response.status === 401 || response.status === 403) {
        stopAndClear("이 화면의 권한이 없어 장부 반영을 다루지 않아요.");
        return null;
      }
      if (!response.ok) { throw new Error("status " + response.status); }
      return response.json();
    })
    .then(function(plan) {
      if (!plan) { return; }
      renderApplyPlan(plan);
      setStatus("새로 반영할 거래 "
                + text((plan.counts || {}).applicable_transactions || 0)
                + "건을 확인했어요. 실행은 따로 눌러야 해요.", "ok");
    })
    .catch(function() {
      setStatus("반영 계획을 세우지 못했습니다.", "err");
    });
}

function newRequestId() {
  // One identity per attempt, so a retry of the same attempt is one request and
  // a fresh press after a refresh is another. The server decides what counts as
  // the same request; this only has to be stable within one.
  var random = Math.floor(Math.random() * 1e9).toString(36);
  return "apply-" + Date.now().toString(36) + "-" + random;
}

function runApply() {
  if (!applyPlanState || !(applyPlanState.counts.applicable_transactions > 0)) { return; }
  // A plan already answered is not answered twice, so a second press after a
  // refresh is refused rather than repeated.
  if (applyPlanState.applied) { return; }
  el("applyBtn").disabled = true;
  applyPlanState.request_id = applyPlanState.request_id || newRequestId();
  setStatus("장부에 반영하는 중입니다...", "");
  fetch(applyUrl, {
    method: "POST", credentials: "same-origin", cache: "no-store",
    headers: {"Content-Type": "application/json",
              "X-CSRF-Token": csrfToken()},
    body: JSON.stringify({
      request_id: applyPlanState.request_id,
      binding: applyPlanState.binding,
      choices_revision: applyPlanState.choices_revision,
      plan_digest: applyPlanState.plan_digest,
      // Which transactions this apply means. The facts are not sent: the server
      // takes them from the digest-checked read it makes itself.
      transactions: applyPlanState.transactions
    })
  })
    .then(function(response) {
      if (response.status === 401 || response.status === 403) {
        stopAndClear("이 화면의 권한이 없어 결정을 저장하지 않아요.");
        return null;
      }
      return response.json().then(function(payload) {
        return {status: response.status, body: payload};
      });
    })
    .then(function(result) {
      if (!result) { return; }
      if (result.status !== 200) {
        applyPlanState = null;
        el("applyBtn").disabled = true;
        setStatus("반영하지 못했어요. 코드: " + text(result.body.code), "err");
        return;
      }
      applyPlanState.applied = true;
      var counts = result.body.counts || {};
      setStatus("반영 " + text(counts.applied || 0) + "건, 그대로 "
                + text(counts.unchanged || 0) + "건, 충돌 "
                + text(counts.conflicts || 0) + "건", "ok");
      loadPlan();
    })
    .catch(function() {
      el("applyBtn").disabled = false;
      setStatus("반영하지 못했습니다.", "err");
    });
}

function renderRefresh(refresh) {
  var node = el("refresh");
  if (!node) { return; }
  if (!refresh || typeof refresh.code !== "string" || refresh.code === "") {
    node.textContent = "";
    node.className = "";
    return;
  }
  node.textContent = refreshLabel(refresh.code);
  node.className = refresh.code === REFRESH_OK_CODE ? "note" : "err";
}
function setStatus(text, kind) {
  var node = el("status");
  node.textContent = text;
  node.className = kind || "";
}
// Every value that came from a source file goes through here and nowhere else.
// A value containing a tag is displayed as that text, never parsed as markup.
function text(value) {
  if (value === null || value === undefined) { return ""; }
  return String(value);
}
function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
function add(parent, tag, className, value) {
  var node = document.createElement(tag);
  if (className) { node.className = className; }
  if (value !== undefined) { node.textContent = text(value); }
  parent.appendChild(node);
  return node;
}
function field(parent, label, value) {
  var row = add(parent, "p", "field");
  add(row, "span", "label", label + ": ");
  add(row, "span", null, value);
  return row;
}
// A row of cells. `parent` is the tbody or thead — never a row — and the tag is
// given, because `document.createElement(null)` yields a `<null>` element, which
// the browser then drops or repairs silently.
function addRow(parent, cells, opts) {
  var settings = opts || {};
  var tr = add(parent, "tr");
  for (var i = 0; i < cells.length; i++) {
    // `head` marks a header row: every cell is a `th`, each scoped to its own
    // column. `rowHead` marks a body row whose first cell names the row, and
    // that one cell is a `th scope="row"`.
    var tag = settings.head ? "th" : (settings.rowHead && i === 0 ? "th" : "td");
    var cell = add(tr, tag, null, cells[i]);
    if (settings.head) { cell.setAttribute("scope", "col"); }
    if (settings.rowHead && i === 0) { cell.setAttribute("scope", "row"); }
  }
  return tr;
}
function evidenceLabel(status) {
  // "원본 항목 확인됨" and "원본 머리글 확인 필요" say exactly what was checked.
  // The old pair — one word, "충분"/"부족" — is read as proof that the bank
  // record is verified and that the schedule is authoritative, and this screen
  // is not where either of those is established.
  return status === "available" ? "원본 항목 확인됨" : "원본 머리글 확인 필요";
}

// The block a source row is. A row from before the kind existed has none, and
// is read as an expense row so an existing installation is not suddenly empty.
function blockKindOf(row) {
  var src = (row && row.source) || {};
  var kind = text(src.block_kind);
  if (kind === "income" || kind === "expense" || kind === "unknown") {
    return kind;
  }
  return "expense";
}

function isIncomeRow(row) { return blockKindOf(row) === "income"; }

// 370000 -> "370,000원". Applied only where the value is a bare amount, so a
// cell that happens to read like a number is not rewritten into money.
function wonText(value) {
  var raw = text(value).replace(/[\s,원]/g, "");
  if (raw === "" || !/^-?[0-9]+$/.test(raw)) { return text(value); }
  return Number(raw).toLocaleString("en-US") + "원";
}

function candidateKeyOf(entry) {
  if (entry && typeof entry.key === "string") { return entry.key; }
  if (entry && typeof entry.candidate_key === "string") { return entry.candidate_key; }
  return "";
}
function refOf(row, index) {
  if (row && typeof row.ref === "string" && row.ref !== "") { return row.ref; }
  return "행 " + text(index + 1);
}
function chosenOf(ref) {
  return Object.prototype.hasOwnProperty.call(choices, ref) ? choices[ref] : "";
}
function isDirty() {
  var keys = Object.keys(choices), i;
  for (i = 0; i < keys.length; i++) {
    if (choices[keys[i]] !== (savedChoices[keys[i]] || "")) { return true; }
  }
  return false;
}
function countBy(fn) {
  var total = 0, i;
  for (i = 0; i < rows.length; i++) { if (fn(rows[i])) { total++; } }
  return total;
}
function renderCounts() {
  var box = el("counts");
  clear(box);
  var income = 0, expense = 0, unknown = 0;
  var selected = 0, rejected = 0, held = 0, i, ref, kind;
  for (i = 0; i < rows.length; i++) {
    kind = blockKindOf(rows[i]);
    if (kind === "income") { income++; } else if (kind === "unknown") {
      unknown++;
    } else { expense++; }
    // The decision counts cover card expenses only. Counting income rows here as
    // "보류" put 207 deposits in a line the owner reads as "approve these",
    // which is the exact misreading this screen is being corrected for. Income
    // has no decision to count: it is looked at, not decided.
    if (kind !== "expense") { continue; }
    ref = refOf(rows[i], i);
    var value = chosenOf(ref);
    if (value === "") { held++; } else if (value === "REJECT") {
      rejected++;
    } else { selected++; }
  }
  var parts = [
    ["검토 원천 " + text(rows.length) + "건", 0],
    ["입금 " + text(income) + "건", 0],
    ["지출 " + text(expense) + "건", 0],
    ["구분 확인 필요 " + text(unknown) + "건", 0],
    // Scoped to card expenses, and labelled as such.
    ["카드 지출 결정 " + text(selected) + "건", 0],
    ["카드 지출 거부 " + text(rejected) + "건", 0],
    ["카드 지출 보류 " + text(held) + "건", 0],
    [savedRevision ? "저장된 상태예요" : "아직 저장된 결정이 없어요", 0]
  ];
  for (i = 0; i < parts.length; i++) {
    var span = add(box, "span", "muted");
    add(span, "b", null, parts[i][0]);
  }
  var kindCounts = {expense: expense, income: income, unknown: unknown, all: rows.length};
  var kindNames = {expense: "지출", income: "입금", unknown: "구분 확인 필요", all: "전체"};
  var options = el("kind").options;
  for (i = 0; i < options.length; i++) {

      setStatus("내보내지 못했습니다. 다시 시도하세요.", "err");
    });
}
function pollSavedRevision() {
  // A poll that finds a newer saved revision never overwrites a choice this
  // device has not saved. It says so and waits for an explicit reload, because
  // replacing a pending decision with someone else's is the one thing this
  // screen must never do on its own.
  // Nothing is polled until a model has been read. Before the first one lands
  // this page has no binding of its own, so the server's binding looks like a
  // source that was replaced underneath it — which is not what happened, and
  // stopping the page over it would leave the first screen permanently dead
  // while its rows sat right there. A full load in flight is waited out for the
  // same reason: its answer is the one the poll is asking about.
  if (polling || saving || stopped || loading || !savedBinding) {
    return Promise.resolve();
  }
  polling = true;
  // The small answer: binding, revision and counts, and nothing else. Asking for
  // the whole comparison every two seconds would move every source row to every
  // open page on a timer, to be told that nothing had changed.
  return fetch(stateUrl + "?state_only=1", {method: "GET",
                          credentials: "same-origin", cache: "no-store",
                          headers: {"Accept": "application/json"}})
    .then(function(response) {
      if (response.status === 401 || response.status === 403) {
        stopAndClear("이 화면의 권한이 없어 실제 자료를 표시하지 않아요.");
        return null;
      }
      if (!response.ok) { return null; }
      return response.json();
    })
    .then(function(state) {
      if (!state) { return; }
      if (state.binding !== savedBinding) {
        // The source itself was replaced. That is the refresh working, not a
        // fault, so the page reads the new bundle instead of stopping — a stopped
        // page that still shows rows looks finished and would never refresh again.
        //
        // The one thing it will not do is overwrite an unsaved decision. Those
        // were made against rows the new bundle may not contain at all, so they
        // stay on screen and the conflict is stated rather than quietly resolved
        // in either direction.
        if (isDirty()) {
          showConflict("새 자료가 반영됐어요. 이 기기에 저장하지 않은 결정이 있어요.");
          setStatus("새 자료는 읽었지만 저장하지 않은 결정은 그대로 두었어요. 다시 불러오면 지워져요.", "warn");
          return;
        }
        load("새 자료로 갱신했어요.");
        return;
      }
      if (state.revision === savedRevision) { return; }
      if (isDirty()) {
        showConflict("이 기기에 저장하지 않은 결정이 있고, 다른 기기에서 더 최근 결정을 저장했어요.");
        setStatus("다른 기기의 저장이 감지됐어요. 내 결정은 그대로 두었습니다.", "warn");
        return;
      }
      // The saved set moved and this page has nothing pending, so the full
      // comparison is read and applied. Only now, and only when something moved.
      load("다른 기기의 결정을 불러왔어요.");
    })
    .catch(function() { return; })
    .then(function() { polling = false; });
}
function csrfToken() {
  var found = document.querySelector('meta[name="csrf-token"]');
  return found ? found.getAttribute("content") : "";
}
el("saveBtn").addEventListener("click", save);
el("exportBtn").addEventListener("click", exportChoices);
// The plan button is the only thing that fetches a plan, and the apply button is
// inert until a plan has been answered. Neither runs on a timer, on save, or on
// reload: an apply is something the owner asks for after reading the counts.
el("planBtn").addEventListener("click", loadPlan);
el("applyBtn").addEventListener("click", runApply);
// A bare `load` here would hand it the click event as the reason to show, and
// the user would be told the other device saved.
el("reloadBtn").addEventListener("click", function() { load(); });
el("prevBtn").addEventListener("click", function() { page--; renderPage(); });
el("nextBtn").addEventListener("click", function() { page++; renderPage(); });
el("searchBtn").addEventListener("click", function() {
  filter = el("q").value.trim();
  page = 0;
  renderPage();
});
el("clearBtn").addEventListener("click", function() {
  el("q").value = "";
  filter = "";
  page = 0;
  renderPage();
});
// `?q=` opens the comparison already narrowed to a term. The board's source
// preview links here with the exact source sheet name, so the rows for that
// trip are on screen instead of the owner scrolling to find them.
//
// Read from the address rather than substituted into the document: the value is
// owner-supplied text, and putting it in the markup would mean escaping it into
// a script context as well as into an attribute. The box is assigned through
// `value`, which this document already does elsewhere, so it stays text.
//
// The search *state* is set as well as the box. Filling the input alone leaves
// `filter` empty, and `renderPage()` filters on that variable rather than on the
// input — so the screen would show a term in the box and every unfiltered row,
// which reads as "the search found nothing" rather than as "the search never
// ran". `page` goes back to the first page because a term can leave a later
// page empty.
//
// Applied before the first `load()`, so the first fetch and the first render
// already carry the term.
(function applyInitialTerm() {
  var params = new URLSearchParams(window.location.search);
  var wanted = text(params.get("kind")).trim();
  // An unrecognised value falls back to the default rather than to "show
  // nothing", so a mistyped query still opens a usable screen.
  if (wanted === "all" || wanted === "income" || wanted === "expense"
      || wanted === "unknown") {
    kindFilter = wanted;
  }
  el("kind").value = kindFilter;
  var found = new URLSearchParams(window.location.search).get("q");
  if (found === null) { return; }
  var term = found.trim();
  filter = term;
  page = 0;
  var field = el("q");
  if (field) { field.value = term; }
})();
el("kind").addEventListener("change", function() {
  kindFilter = el("kind").value;
  page = 0;
  var address = new URL(window.location.href);
  address.searchParams.set("kind", kindFilter);
  if (filter) { address.searchParams.set("q", filter); }
  else { address.searchParams.delete("q"); }
  window.history.replaceState(null, "", address.toString());
  renderPage();
});
load();
setInterval(function() { pollSavedRevision(); }, POLL_MS);
// An inspection hook, the same idea as the board's own `window.__ledgerLiveSync`.
// It is how a test reads what the screen is holding without depending on which
// page a row happens to be drawn on, and how a choice is confirmed to be recorded
// rather than merely clicked.
window.__realReview = {
  choices: function() { return JSON.parse(JSON.stringify(choices)); },
  saved: function() { return JSON.parse(JSON.stringify(savedChoices)); },
  revision: function() { return savedRevision; },
  binding: function() { return savedBinding; },
  saving: function() { return saving; },
  stopped: function() { return stopped; },
  loading: function() { return loading; },
  draftHeld: function() { return choicesDiffer(loadCapturedChoices, choices); },
  rows: function() { return rows.length; },
  // The search term and how many rows it leaves visible. Exposed so a test can
  // tell "the term narrowed the rows" from "the box was filled and nothing
  // else happened" — which look identical from the document, and are the same
  // failure. Read only; nothing here changes state.
  filter: function() { return filter; },
  visibleRows: function() { return visibleIndexes().length; },
  isDirty: isDirty,
  visibleCount: function() { return visibleIndexes().length; },
  page: function() { return page; },
  reload: load
};
})();
</script>
