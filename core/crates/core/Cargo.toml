[package]
name = "cost-core"
description = "COST 판정 코어: 판정 타입·불변식(domain), 날짜·완료 기간·열린 범위(dates). 후속 단위가 store·rules·trips·links·pipeline·bridge 모듈을 추가한다"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
